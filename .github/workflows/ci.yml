name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arc_ci_test
          POSTGRES_USER: arc_ci
          POSTGRES_PASSWORD: arc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arc_ci -d arc_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://arc_ci:arc_ci@localhost:5432/arc_ci_test
      TEST_DATABASE_URL: postgresql+psycopg://arc_ci:arc_ci@localhost:5432/arc_ci_test
      ENVIRONMENT: test
      DEBUG: "false"
      RAZORPAY_WEBHOOK_SECRET: ci_only_webhook_secret_for_tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest
